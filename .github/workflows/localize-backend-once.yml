name: Verify and apply Korean localization
on:
  push:
    branches: [feat/korean-localization]
    paths: [.github/workflows/localize-backend-once.yml]
permissions:
  contents: write
concurrency:
  group: korean-source-update
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'andongmin94/ARTEX'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex-test-only
          POSTGRES_DB: artex
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:artex-test-only@127.0.0.1:5432/artex?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/korean-localization
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply final source and regression fixes
        id: apply
        run: |
          python3 .localization/fix-tests.py
          python3 .localization/repair-finalize.py
          python3 .localization/finalize.py
          python3 .localization/finish-cli.py
          python3 .localization/verify-fixes.py
          python3 .localization/finish-docs.py
          python3 .localization/finish-quality.py
          python3 .localization/finish-smoke.py
      - name: Compile and test backend
        id: backend
        run: |
          go build -o /tmp/artex-check ./cmd/artex
          go test -p 1 -count=1 -timeout 180s ./... 2>&1 | tee backend-test.log
      - name: Check and build Korean frontend
        id: frontend
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        working-directory: web
        run: |
          npm ci
          npm run check:korean
          npm run test:input
          npx tsc --noEmit
          npm run build:static
      - name: Check Docker Compose and installation scripts
        id: deployment
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        env:
          POSTGRES_PASSWORD: ci-test-only
        run: |
          docker compose config --quiet
          bash -n install.sh update.sh start.sh build.sh dev.sh reset-password.sh
      - name: Inspect local Korean mock UI in Chromium
        id: browser
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        run: |
          npm install --prefix /tmp/artex-browser --no-save --package-lock=false playwright
          /tmp/artex-browser/node_modules/.bin/playwright install --with-deps chromium
          (cd web && NEXT_PUBLIC_MOCK=1 npm run build:static)
          python3 -m http.server 5174 --bind 127.0.0.1 --directory web/out >/tmp/artex-static.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          NODE_PATH=/tmp/artex-browser/node_modules node .localization/smoke-ui.cjs
      - name: Commit verified source and remove temporary translation tooling
        if: ${{ !cancelled() && steps.backend.outcome == 'success' && steps.frontend.outcome == 'success' && steps.deployment.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent cmd config db enrich evidence guard intercept internal llmpool llmrec mcphttp notify report selfupdate server sidequestion traffic web/src web/scripts web/package.json docs CHANGELOG.md README.md .dockerignore .env.example config.example.json install.sh update.sh dev.sh reset-password.sh build.sh start.sh start.bat skills
          git rm -r -f .localization
          if ! git diff --cached --quiet; then
            git commit -m 'feat(i18n): complete verified Korean localization, IME handling and fork-safe installation'
            git push origin HEAD:feat/korean-localization
          fi
      - name: Package reviewed source and test results
        if: always()
        run: tar --exclude=node_modules --exclude=.next --exclude=out --exclude=.git --exclude=source.tar -cf source.tar .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localized-verified-source
          path: source.tar
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: korean-ui-verification
          path: verification/korean-ui
          if-no-files-found: ignore
          retention-days: 7
