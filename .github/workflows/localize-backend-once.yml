name: Verify and apply Korean localization
on:
  push:
    branches: [feat/korean-localization]
    paths: [.github/workflows/localize-backend-once.yml]
permissions:
  contents: write
concurrency:
  group: korean-source-update
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'andongmin94/ARTEX'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex-test-only
          POSTGRES_DB: artex
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:artex-test-only@127.0.0.1:5432/artex?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/korean-localization
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply final source and regression fixes
        run: |
          python3 .localization/fix-tests.py
          python3 .localization/repair-finalize.py
          python3 .localization/finalize.py
          python3 .localization/finish-cli.py
      - name: Compile and test backend
        run: |
          go build -o /tmp/artex-check ./cmd/artex
          go test -p 1 -count=1 -timeout 180s ./... 2>&1 | tee backend-test.log
      - name: Check and build Korean frontend
        working-directory: web
        run: |
          npm ci
          node scripts/check-korean.cjs
          npx tsc --noEmit
          npm run build:static
      - name: Check Docker Compose and installation scripts
        env:
          POSTGRES_PASSWORD: ci-test-only
        run: |
          docker compose config --quiet
          bash -n install.sh update.sh start.sh build.sh dev.sh reset-password.sh
      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent cmd config db enrich evidence guard intercept llmpool llmrec mcphttp notify report selfupdate server sidequestion traffic web/src web/scripts README.md .dockerignore .env.example config.example.json install.sh update.sh dev.sh reset-password.sh build.sh start.sh start.bat
          if ! git diff --cached --quiet; then
            git commit -m 'feat(i18n): finish verified Korean localization and fork-safe installation'
            git pull --rebase origin feat/korean-localization
            git push origin HEAD:feat/korean-localization
          fi
      - name: Package reviewed source and test results
        if: always()
        run: tar --exclude=node_modules --exclude=.next --exclude=out --exclude=.git --exclude=source.tar -cf source.tar .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localized-verified-source
          path: source.tar
          retention-days: 3
