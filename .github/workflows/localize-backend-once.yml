name: Publish verified Korean localization
on:
  push:
    branches: [feat/korean-localization]
    paths: [.github/workflows/localize-backend-once.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: korean-source-update
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'andongmin94/ARTEX'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex-test-only
          POSTGRES_DB: artex
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:artex-test-only@127.0.0.1:5432/artex?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/korean-localization
          fetch-depth: 0
      - name: Recover source that passed all browser and build checks
        uses: actions/download-artifact@v4
        with:
          name: localized-verified-source
          run-id: 37204046006
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/korean-verified
      - name: Apply verified source, final SQL messages and documentation
        run: |
          tar --exclude='./.github' --exclude='./.github/*' --exclude='./.localization' --exclude='./.localization/*' --exclude='./.git' --exclude='./.git/*' -xf /tmp/korean-verified/source.tar
          python3 <<'PY'
          from pathlib import Path
          import json
          checks = json.loads(Path('verification/korean-ui/summary.json').read_text())
          assert len(checks['desktop']) == 22 and len(checks['mobile']) == 3
          assert len(checks['dialogs']) == 2 and not checks['failures'] and not checks['pageErrors']
          p = Path('db/schema.sql')
          text = p.read_text(encoding='utf-8')
          for old, new in {
              '任务执行期间自动关联': '작업 실행 중 자동 연결',
              '由历史任务资产关联迁移': '기존 작업의 자산 연결에서 가져옴',
              '复测会话已删除': '재검증 세션이 삭제되었습니다',
          }.items():
              assert text.count(old) == 1, old
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          p = Path('.gitignore')
          text = p.read_text(encoding='utf-8').replace('# docs\n/docs/\n', '')
          p.write_text(text, encoding='utf-8')
          old = Path('docs/漏洞流量证据.md')
          if old.exists():
              old.unlink()
          p = Path('README.md')
          text = p.read_text(encoding='utf-8').replace('git switch feat/korean-localization\n', '')
          text = text.replace('npm ci\nnpx tsc --noEmit', 'npm ci\nnpm run check:korean\nnpm run test:input\nnpx tsc --noEmit')
          p.write_text(text, encoding='utf-8')
          Path('internal/localization/sql_test.go').write_text('''package localization

          import (
              "os"
              "path/filepath"
              "strings"
              "testing"
              "unicode"
          )

          // SQL triggers produce UI messages without going through Go literals.
          func TestSQLRuntimeTextIsLocalized(t *testing.T) {
              content, err := os.ReadFile(filepath.Join("..", "..", "db", "schema.sql"))
              if err != nil { t.Fatal(err) }
              for n, line := range strings.Split(string(content), "\\n") {
                  code, _, _ := strings.Cut(line, "--")
                  // Existing historical input marker, not a new display label.
                  code = strings.ReplaceAll(code, "'[模型]%'", "'historical-model-prefix'")
                  for _, r := range code {
                      if unicode.Is(unicode.Han, r) {
                          t.Errorf("untranslated SQL runtime text at schema.sql:%d: %s", n+1, code)
                          break
                      }
                  }
              }
          }
          ''', encoding='utf-8')
          print('Verified UI source restored; final SQL messages and README completed')
          PY
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate completed backend
        run: |
          gofmt -w internal/localization/sql_test.go
          go test -p 1 -count=1 -timeout 180s ./...
          go build -o /tmp/artex-korean ./cmd/artex
      - name: Validate production frontend and Korean input
        working-directory: web
        run: |
          npm ci
          npm run check:korean
          npm run test:input
          npx tsc --noEmit
          npm run build:static
      - name: Validate deployment
        env:
          POSTGRES_PASSWORD: ci-test-only
        run: |
          docker compose config --quiet
          bash -n install.sh update.sh start.sh build.sh dev.sh reset-password.sh
      - name: Commit validated changes without temporary translation scripts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent cmd config db enrich evidence guard intercept internal llmpool llmrec mcphttp notify report selfupdate server sidequestion traffic web/src web/scripts web/package.json docs CHANGELOG.md README.md .gitignore .dockerignore .env.example config.example.json install.sh update.sh dev.sh reset-password.sh build.sh start.sh start.bat skills
          git rm -r -f .localization
          git diff --cached --stat
          git commit -m 'feat(i18n): complete Korean product localization and regression checks'
          git push origin HEAD:feat/korean-localization
