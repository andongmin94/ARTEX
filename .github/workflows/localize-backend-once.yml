name: Apply Korean backend localization
on:
  push:
    branches: [feat/korean-localization]
    paths: [.github/workflows/localize-backend-once.yml]
permissions:
  contents: write
concurrency:
  group: korean-source-update
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'andongmin94/ARTEX'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex-test-only
          POSTGRES_DB: artex
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:artex-test-only@127.0.0.1:5432/artex?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/korean-localization
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply syntax-aware backend translations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.localization/apply-go.go')
          text = p.read_text()
          text = text.replace('func gofiles(root string) []string {', 'func gofiles(root string) []string {\n root, err := filepath.Abs(root); must(err)')
          p.write_text(text)
          PY
          go run .localization/apply-go.go
      - name: Compile backend
        run: go build -o /tmp/artex-check ./cmd/artex
      - name: Run backend unit and PostgreSQL integration tests
        run: go test -count=1 -timeout 180s ./... 2>&1 | tee backend-test.log
      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent cmd config db enrich evidence guard intercept llmpool llmrec mcphttp notify report selfupdate server sidequestion traffic
          if ! git diff --cached --quiet; then
            git commit -m 'feat(i18n): localize backend messages, agent prompts and reports'
            git push origin HEAD:feat/korean-localization
          fi
      - name: Package reviewed source and test results
        if: always()
        run: tar --exclude=node_modules --exclude=.next --exclude=out --exclude=.git --exclude=source.tar -cf source.tar .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localized-backend-source
          path: source.tar
          retention-days: 3
