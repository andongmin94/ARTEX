name: Apply reviewed Korean localization
on:
  push:
    branches: [feat/korean-localization]
    paths: [.github/workflows/localize-once.yml]
permissions:
  contents: write
concurrency:
  group: korean-source-update
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'andongmin94/ARTEX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/korean-localization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Apply syntax-aware translations and check for untranslated UI
        run: node .localization/apply-ui.cjs
      - name: Type check
        run: npx tsc --noEmit
        working-directory: web
      - name: Build static frontend
        run: npm run build:static
        working-directory: web
      - name: Commit reviewed source to the localization branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src agent db intercept server guard .github/workflows/verify.yml
          if ! git diff --cached --quiet; then
            git commit -m 'feat(i18n): complete Korean UI, demo content and locale formatting'
            git push origin HEAD:feat/korean-localization
          fi
      - name: Package reviewed source
        if: always()
        run: tar --exclude=node_modules --exclude=.next --exclude=out --exclude=.git --exclude=source.tar -cf source.tar .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localized-source
          path: source.tar
          retention-days: 3
