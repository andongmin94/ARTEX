name: verify
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Check Korean runtime text
        run: npm run check:korean
        working-directory: web
      - name: Check Korean IME input
        run: npm run test:input
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run build:static
        working-directory: web
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex-test-only
          POSTGRES_DB: artex
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:artex-test-only@127.0.0.1:5432/artex?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 기존 패키지 일부가 같은 테스트 DB를 사용하므로 패키지는 순서대로 실행합니다.
      - name: Run all backend tests and retain per-test results
        run: |
          git rev-parse HEAD > backend-source.txt
          git ls-files '*.go' '*.sql' >> backend-source.txt
          status=0
          go test -json -p 1 -count=1 -timeout 180s ./... > backend-results.jsonl || status=$?
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          counts = Counter()
          for line in Path('backend-results.jsonl').read_text(encoding='utf-8').splitlines():
              event = json.loads(line)
              action = event.get('Action')
              if action == 'output':
                  print(event.get('Output', ''), end='')
              if event.get('Test') and '/' not in event['Test'] and action in ('pass', 'fail', 'skip'):
                  counts[action] += 1
              if action in ('fail', 'skip'):
                  print(f"TEST {action}: {event.get('Package')} {event.get('Test', '')}")
          print(f'Backend top-level test outcomes: {dict(counts)}')
          PY
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend-source.txt
            backend-results.jsonl
          if-no-files-found: warn
          retention-days: 14
      - run: go build ./cmd/artex
      - name: Check real backend desktop lifecycle
        env:
          ARTEX_SMOKE_PG_DSN: postgres://artex:artex-test-only@127.0.0.1:5432/artex_desktop_smoke?sslmode=disable
        run: node scripts/check-backend-lifecycle.mjs ./artex
  desktop-foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check writable runtime home
        run: go test -race -count=1 -timeout 60s ./config
      - name: Check native HTTP and parent-pipe lifecycle
        run: go test -race -count=1 -timeout 60s cmd/artex/http_lifecycle.go cmd/artex/http_lifecycle_test.go
  storage-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test storage source inventory
        run: go test -race -count=1 -timeout 60s ./scripts/sqlite-inventory
      - name: Inventory all Go and SQL sources without a database
        run: |
          go run ./scripts/sqlite-inventory > sqlite-inventory.md
          cat sqlite-inventory.md
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite-porting-inventory
          path: sqlite-inventory.md
          if-no-files-found: error
          retention-days: 14
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check installation scripts
        run: bash -n install.sh update.sh start.sh build.sh dev.sh reset-password.sh
      - name: Validate local-source Compose deployment
        env:
          POSTGRES_PASSWORD: ci-test-only
        run: docker compose config --quiet
