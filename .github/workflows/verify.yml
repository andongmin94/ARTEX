name: verify
on:
  push:
    branches: [main, feat/korean-localization]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Check Korean runtime text
        run: node scripts/check-korean.cjs
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run build:static
        working-directory: web
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex-test-only
          POSTGRES_DB: artex
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:artex-test-only@127.0.0.1:5432/artex?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # 기존 패키지 일부가 같은 테스트 DB를 사용하므로 패키지는 순서대로 실행합니다.
      - run: go test -p 1 -count=1 -timeout 180s ./...
      - run: go build ./cmd/artex
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check installation scripts
        run: bash -n install.sh update.sh start.sh build.sh dev.sh reset-password.sh
      - name: Validate local-source Compose deployment
        env:
          POSTGRES_PASSWORD: ci-test-only
        run: docker compose config --quiet
