<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; font-src 'self'; connect-src 'none'"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ARTEX 시작</title>
<style>@font-face{font-family:ArtexKorean;src:url('artex://startup/fonts/NotoSansKR-Variable.ttf');font-weight:100 900;font-display:swap}body{background:#f4f5f7;color:#18191c;font:500 16px ArtexKorean,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center}.panel{width:min(560px,80vw);padding:32px;background:#fff;border:2px solid #27282b;border-radius:5px;box-shadow:4px 4px #27282b}h1{font-size:28px}p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:35vh;overflow:auto;font-size:12px;background:#f4f5f7;padding:12px;border:1px solid #27282b}summary{cursor:pointer}button{font:inherit;border:2px solid #27282b;border-radius:5px;padding:8px 16px;margin:16px 8px 0 0;cursor:pointer;background:#27282b;color:white;box-shadow:4px 4px #27282b}button:focus-visible{outline:3px solid #526e85;outline-offset:3px}button:disabled{opacity:.5;cursor:default}@media(prefers-reduced-motion:reduce){*{transition:none}}</style></head>
<body><main class="panel"><h1>ARTEX</h1><p id="message" role="status">로컬 저장소와 백엔드를 준비하는 중…</p><details id="diagnostics" hidden><summary>진단 정보</summary><pre id="details"></pre></details><button id="retry" disabled>다시 시도</button><button id="quit">앱 종료</button></main><script src="artex://startup/startup.js"></script></body></html>
